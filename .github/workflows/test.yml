name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=ssa --cov-report=term-missing --cov-report=xml

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v -m "not slow"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.9'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Check code formatting with black
        run: black --check ssa/ tests/

      - name: Check import sorting with isort
        run: isort --check-only ssa/ tests/

      - name: Lint with flake8
        run: flake8 ssa/ tests/ --max-line-length=88 --extend-ignore=E203,W503,E501

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security scanning tools
        run: |
          pip install bandit[toml] safety

      - name: Run bandit security scan
        run: |
          bandit -r ssa/ -f json -o bandit-report.json || true
          bandit -r ssa/ -ll

      - name: Check for known security vulnerabilities with safety
        run: |
          pip install -e .
          safety check --json --output safety-report.json || true
          safety check

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
